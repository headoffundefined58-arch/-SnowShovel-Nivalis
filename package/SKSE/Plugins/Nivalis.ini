; ================================================================
;  Nivalis 雪相 0.5  —— 雪 · 水 · 冰 相变框架
;
;  一句玩法：按 I 扫地 -> 松雪扫拢成堆 -> 随游戏时间化水 / 冻冰
;           -> 火把冰烤回水 -> 水汇成水洼 -> 慢慢渗进土地。
;
;  依赖：时间炼成 AOT（相变时钟）、动态地形变化 NMN（动态雪面）
;  可选：动态血池框架（水洼）、SKSE 菜单框架（游戏内设置菜单）
;
;  改完保存即可生效（插件每帧重读此文件）。
;  游戏内菜单：SKSE 菜单框架 -> Nivalis -> 雪相，改完自动写回这里。
; ================================================================

[General]
; 总开关
Enable = true
; 每次动作写日志，排查用
Debug = false
; 左上角提示
Notify = true
; 积雪记录上限（超限丢最旧的）
MaxPiles = 200
; 菜单语言：cn / en
Language = cn

; ----------------------------------------------------------------
[Sweep]
; 热键：按一次开始扫地，再按一次停下。室内室外都能用。
; 键码是 DirectInput 扫描码：I=23, K=37, J=36, B=48, N=49；0 = 关闭。
SweepKey = 23
SweepAnywhere = true
; 【固定规则】背包里必须有扫帚才能扫地。故意不放进游戏内菜单。
SweepNeedBroom = true
; 额外入口：手持扫帚挥击也扫（默认关，留作可选）
TriggerOnAttack = false
; 扫地动作使用的原版 idle
SweepIdle = Skyrim.esm:0640FE
; idle 起来到扫帚落地
SweepStartDelay = 0.9
; 两次扫动的间隔（真实秒）
SweepInterval = 2.2
; 超时保护（真实秒），扫地动画停止事件丢失时兜底
SweepTimeout = 30
; 再按一次热键时，用来打断扫地动作的行为图事件。
; IdleStop 是标准做法；万一某套装里它停不下来，改成 IdleForceDefaultState（硬切回默认姿态）。
SweepStopEvent = IdleStop

; ----------------------------------------------------------------
; 动态地形变化（NMN_DeformableTerrain）联动 —— 硬需求
; 原理：该插件监听施法事件把雪"挖开"。扫到雪地时本插件发一个合成
; 施法事件（不会真的施法、无伤害无特效），地形雪面就被扫出一片空地。
[Terrain]
EnableTerrainCarve = true
; 用于合成事件的法术（任意真实存在的法术 FormID）
CarveSpell = Skyrim.esm:02B96B
; 两次挖雪之间的冷却（秒）
CarveCooldown = 2
; 把脚下的松雪扫拢成堆
GatherPiles = true
GatherRadius = 260
ForwardDistance = 110

; ----------------------------------------------------------------
; 相变：雪 -> 水 -> 冰（时钟 = 游戏时间，与时间炼成同一套）
;
;   白天累积「暖时」，夜里累积「寒时」，谁先到阈值谁生效。
;   所以：午后扫的雪堆会化成水；过夜丢着的雪堆会冻成冰。
;   火 / 火盆 / 锻炉旁的雪与冰会加速化成水（见 [Heat]）。
[Phases]
PhaseEnabled = true
; 声明依赖时间炼成：AlchemyOfTime.dll 不在 -> 相变不跑。
; 想在没装 AOT 的情况下也跑相变，把它改成 false。
PhaseRequireAOT = true
; 暖时累计到此值（游戏小时）化成水
MeltWarmHours = 3
; 寒时累计到此值（游戏小时）冻成冰；0 = 永不结冰
FreezeColdHours = 5
; 冰在暖时累计到此值（游戏小时）化成水
IceWarmHours = 2
; 水洼存留多少真实秒后被土地吸收
WaterSoakSeconds = 90
; 水相期间每隔多少秒再漫出一滩（流的到处都是）
PuddleEvery = 18
; 每次出水同时生成几滩
PuddleCount = 3
; 水洼散布半径（游戏单位）
PuddleSpread = 110
; 血池框架 profile 名，对应 SKSE\DynamicBloodpoolFramework\NivalisWater.json
PuddleProfileID = NivalisMelt
; 相变时长预设（AOT 风格 yml）。里面的数值会覆盖上面的小时数，改完即刻生效。
PhaseTimesFile = Data\SKSE\Plugins\Nivalis\phases.yml

; ----------------------------------------------------------------
; 热源与水洼（需要「动态血池框架」）
[Heat]
; 热源把雪 / 冰烤化成水洼；关掉则热源只让雪堆消失不留水
EnableMeltWater = true
; 环境融雪水洼节奏（真实秒）
MeltWaterInterval = 9
; 距热源多近算"热"（游戏单位）
MeltProbeRadius = 200
; 雪堆受热多少秒化成水
PileMeltSeconds = 6
; 冰堆受热多少秒化成水（比雪慢）
IceMeltSeconds = 14
; 热源关键词（与动态地形插件的 HeatKeywords 保持一致）
HeatKeywords = fire,campfire,brazier,firepit,candle,torch,forge,smelt,hearth

; ----------------------------------------------------------------
[Piles]
; 雪堆外观（小 -> 大）。同序号对应冰堆外观。
SnowStatics = Skyrim.esm:07F948,Skyrim.esm:07F949,Skyrim.esm:06021F,Skyrim.esm:060220,Skyrim.esm:06021D
IceStatics = Skyrim.esm:0F1FEE,Skyrim.esm:0F1FEF,Skyrim.esm:0CC75E,Skyrim.esm:0CC761,Skyrim.esm:0CC760
; 雪堆判定半径
PileRadius = 90
; 冰堆要扫几下才碎
SweepsToBreakIce = 3
; 相变 / 3D 刷新间隔（真实秒）
RefreshSeconds = 2
SaveOnChange = true

; ----------------------------------------------------------------
[Tools]
; 识别为扫帚的表单（背包里有就行）
Brooms = Skyrim.esm:06717F
BroomNameKeys = broom,扫帚,扫把

; ----------------------------------------------------------------
[Snow]
SnowTextureKeys = snow,snow01,snow02,snow03,drift
SnowMaterialKeys = snow

; ----------------------------------------------------------------
[Sound]
EnableSound = true
; 冰碎声
DumpSounds = Skyrim.esm:0FB9AB
; 扫雪沙沙声
BroomSounds = Skyrim.esm:0FB9A4