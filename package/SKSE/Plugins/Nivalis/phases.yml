# Nivalis 雪相 —— 相变时长预设
#
# 用「时间炼成 Alchemy of Time」的 preset 写法（Key: 数值，单位：游戏小时），
# 因为整套相变跑的就是 AOT 那套游戏时钟。改完保存即刻生效，不必重启游戏。
#
# 这些值会覆盖 Nivalis.ini 里同名的设置；删掉某一行就退回 ini 的值。
# 只有 > 0 的数值才会生效。

# 白天累积多少「暖时」后，松雪化成水
MeltWarmHours: 3

# 夜里累积多少「寒时」后，雪堆冻成冰（0 或删掉 = 永不结冰）
FreezeColdHours: 5

# 冰在白天累积多少「暖时」后，化成水
IceWarmHours: 2

# 水洼在地上存留多少真实秒后，被土地吸收
WaterSoakSeconds: 90

# 水相期间每隔多少真实秒再漫出一滩（"流的到处都是"）
PuddleEvery: 18

# 水洼散布半径（游戏单位）
PuddleSpread: 110
